name: 每日快照

on:
  schedule:
    # 北京时间 09:15 = UTC 01:15（开盘前）
    - cron: '15 1 * * 1-5'
    # 北京时间 15:40 = UTC 07:40（收盘后）
    - cron: '40 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成快照
        run: python scripts/snapshot.py

      - name: 提交更新
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "snapshot: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
