<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股全球雷达 · 事件驱动</title>
<style>
/* ===== Apple Liquid Glass 浅色白玻璃版 ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(150deg,#eef4ff 0%,#f7f3ff 30%,#e8f4f8 55%,#f5f0ff 100%);
  color:#1d1d1f;min-height:100vh;overflow-x:hidden;padding:36px 20px 60px;
}
/* 彩色辉光光斑（浅色下的柔和光） */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(110px);z-index:0;pointer-events:none;
}
body::before{width:480px;height:480px;background:rgba(120,180,255,.30);top:-140px;left:-100px;animation:float1 18s ease-in-out infinite}
body::after{width:420px;height:420px;background:rgba(200,150,255,.25);bottom:-120px;right:-80px;animation:float2 22s ease-in-out infinite}
@keyframes float1{50%{transform:translate(70px,50px) scale(1.12)}}
@keyframes float2{50%{transform:translate(-60px,-40px) scale(1.08)}}
.container{position:relative;z-index:1;max-width:1120px;margin:0 auto}
h1{font-size:32px;font-weight:700;letter-spacing:-0.8px;margin-bottom:6px;
  background:linear-gradient(120deg,#1d1d1f 20%,#0a68d4 55%,#7b3fe4 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#6e6e73;font-size:14px;margin-bottom:30px}
.sub b{color:#0a68d4}
/* 白玻璃卡片：高透明白玻璃 + 强模糊 */
.glass{
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  border-radius:24px;
  box-shadow:0 10px 40px rgba(80,100,160,.12),inset 0 1px 1px rgba(255,255,255,.9);
  padding:22px;margin-bottom:18px;transition:transform .25s ease,box-shadow .25s ease;
}
.glass:hover{transform:translateY(-3px);box-shadow:0 18px 52px rgba(80,100,160,.18),inset 0 1px 1px rgba(255,255,255,.95)}
.glass h3{font-size:14px;font-weight:600;color:#0a68d4;letter-spacing:.4px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.glass h3::before{content:'';width:6px;height:6px;border-radius:50%;background:linear-gradient(120deg,#0a68d4,#7b3fe4);box-shadow:0 0 10px rgba(10,104,212,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-size:14px;border-bottom:1px solid rgba(29,29,31,.06)}
.row:last-child{border-bottom:none}
.up{color:#0a9e3c;font-weight:600;text-shadow:0 0 14px rgba(10,158,60,.25)}
.down{color:#e0342c;font-weight:600;text-shadow:0 0 14px rgba(224,52,44,.22)}
.flat{color:#8e8e93}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;margin-right:8px;
  background:rgba(10,104,212,.08);border:1px solid rgba(10,104,212,.22);color:#0a68d4;font-weight:500}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(29,29,31,.05);border:1px solid rgba(29,29,31,.1);color:#6e6e73}
.chain{font-size:12px;color:#6e6e73;margin-top:8px;line-height:1.7}
.evt{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(29,29,31,.07)}
.evt:last-child{border-bottom:none;margin-bottom:0}
.evt b{font-size:14px;color:#1d1d1f}
.footer{color:#86868b;font-size:12px;text-align:center;margin-top:32px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0a9e3c;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
/* 涨跌停温度条 */
.temp{display:flex;align-items:center;gap:10px;font-size:13px}
.temp .bar{flex:1;height:8px;border-radius:6px;background:rgba(29,29,31,.08);overflow:hidden;display:flex}
.temp .upb{background:linear-gradient(90deg,#0a9e3c,#30d158);height:100%}
.temp .dnb{background:linear-gradient(90deg,#e0342c,#ff6961);height:100%}
</style>
</head>
<body>
<div class="container">
  <h1>A股全球雷达 · 事件驱动</h1>
  <div class="sub"><span class="pulse"></span><b id="updated">更新于 …</b> · 每 10 秒自动刷新 · 事件 → 行业 → 埋伏</div>

  <div class="grid">
    <div class="glass"><h3>大盘指数</h3><div id="idx"></div></div>
    <div class="glass"><h3>行业主力雷达</h3><div id="sector"></div></div>
    <div class="glass"><h3>涨跌停温度</h3><div id="limit"></div></div>
  </div>

  <div class="grid" style="margin-top:0">
    <div class="glass"><h3>调仓建议 · 10 日</h3><div id="recs"></div></div>
    <div class="glass"><h3>事件埋伏观察池</h3><div id="ambush"></div></div>
  </div>

  <div class="glass" style="margin-top:18px"><h3>事件雷达（已核验 · 传导链 · 预计窗口）</h3><div id="events"></div></div>

  <div class="footer">数据：腾讯实时 · 东方财富 · FTShare ｜ 客观信号输出，不构成投资建议 ｜ 投资有风险</div>
</div>

<script>
function pct(v){
  if(v==null)return '<span class="flat">-</span>';
  var c=v>0?'up':'down';
  return '<span class="'+c+'">'+(v>0?'+':'')+v.toFixed(2)+'%</span>';
}
function refresh(){
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='更新于 '+d.updated;
  var idx='';
  ['sh','sz','hs300'].forEach(k=>{var v=d.idx[k];if(v&&v.name)idx+='<div class="row"><span>'+v.name+'</span><span>'+v.price+' '+pct(v.pct)+'</span></div>'});
  document.getElementById('idx').innerHTML=idx;
  var sec='';d.sector.forEach(r=>{sec+='<div class="row"><span>'+r.name+'</span><span>主力 '+r.net.toFixed(1)+'亿 '+pct(r.pct)+'</span></div>'});
  document.getElementById('sector').innerHTML=sec;
  var lm='<div class="temp"><span>涨停 '+d.limit.up+'</span><div class="bar"><div class="upb" style="width:'+Math.min(100,d.limit.up/2)+'%"></div></div><span class="down">跌停 5</span></div>'
        +'<div class="chain">最新涨停家数（'+(d.limit.date||'')+'）</div>';
  document.getElementById('limit').innerHTML=lm;
  var recs='';d.recs.forEach(r=>{recs+='<div class="row"><span><span class="tag">'+r.tag+'</span>'+r.name+'</span><span>'+r.price+' '+pct(r.pct)+'</span></div>'});
  document.getElementById('recs').innerHTML=recs;
  var am='';d.ambush.forEach(r=>{am+='<div class="row"><span><span class="tag">'+r.tag+'</span>'+r.name+'</span><span>'+r.price+' '+pct(r.pct)+'</span></div>'});
  document.getElementById('ambush').innerHTML=am;
  var ev='';d.events.forEach(e=>{
    ev+='<div class="evt"><b>'+e.name+'</b> <span class="badge">'+e.type+'</span> <span class="badge">预计窗口 '+e.expected+'</span>'
       +'<div class="chain">传导链：'+e.chain+'</div><div class="chain">验证：'+e.verification+'</div></div>';
  });
  document.getElementById('events').innerHTML=ev;
}).catch(()=>{document.getElementById('updated').textContent='刷新失败，重试中…'});
}
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
